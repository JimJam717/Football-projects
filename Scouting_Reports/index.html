<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2025 Player Scouting Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="header-title">IPL 2025 SCOUTING REPORT</h1>
            <p class="subtitle">Powered by Cricsheet · IPL 2025</p>
        </div>
        <div class="mobile-select-container">
            <select id="playerSelectMobile"></select>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="search-container">
                <input type="text" id="player-search" placeholder="Search players..." autocomplete="off">
                <div id="player-count" class="player-count">Showing 0 of 0 players</div>
            </div>
            
            <div class="team-filters" id="team-pills">
                <!-- Team pills injected here -->
            </div>

            <div class="player-list" id="sidebar-player-list">
                <!-- Player rows injected here -->
            </div>
        </aside>

        <main class="main-panel" id="report-container">
            <div class="empty-state">
                <p>Select a player from the sidebar to view their scouting report.</p>
            </div>
        </main>
    </div>

    <div id="tooltip" class="tooltip" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
